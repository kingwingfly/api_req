[package]
name = "api_req"
version = "0.4.0"
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/api_req"
description = "A library for making API requests with ease"
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
api_req_derive = { path = "../api_req_derive", version = "0.4.0-alpha" }
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
serde_json = { version = "1" }
serde_urlencoded = { version = "0.7" }
pin-project = "1.1"
futures-util = { version = "0.3", optional = true }
bytes = { version = "1.10", optional = true }

[features]
default = ["cookies"]
stream = ["dep:futures-util", "dep:bytes", "reqwest/stream"]
cookies = ["reqwest/cookies", "api_req_derive/cookies"]
